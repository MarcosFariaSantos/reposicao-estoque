<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reposição de estoque | Moto peças</title>
<style>
:root{--bg:#eceff2;--painel:#fff;--tx:#161a1f;--mut:#5d6672;--bd:#d9dee4;--amarelo:#f2c200;--crit:#c9302c;--aten:#b36b00;--ok:#1d7f4e;--trilho:#e3e7ec}
@media(prefers-color-scheme:dark){:root{--bg:#15181c;--painel:#1e2227;--tx:#eef1f4;--mut:#9aa4b0;--bd:#2f353c;--crit:#ff6b64;--aten:#f0b13a;--ok:#4cd08c;--trilho:#2b3138}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
.pagina{max-width:960px;margin:0 auto;padding:32px 16px 56px}
header{border-left:6px solid var(--amarelo);padding-left:14px;margin-bottom:22px}
h1{font-size:1.7rem;line-height:1.2;margin:0;font-weight:700}
header p{margin:4px 0 0;color:var(--mut)}
.aviso{background:var(--painel);border:1px solid var(--bd);border-radius:6px;padding:10px 14px;margin-bottom:18px;font-size:.9rem;color:var(--mut)}
.resumo{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0 0 14px;padding:0;list-style:none}
.resumo b{font-size:1.5rem;margin-right:6px}
.resumo li{color:var(--mut)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filtros button{font:inherit;background:var(--painel);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:5px 14px;cursor:pointer}
.filtros button[aria-pressed="true"]{background:var(--tx);color:var(--painel);border-color:var(--tx)}
button:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}
ul.lista{list-style:none;margin:0;padding:0;background:var(--painel);border:1px solid var(--bd);border-radius:6px}
.linha{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 150px;gap:8px 20px;align-items:center;padding:14px 16px;border-top:1px solid var(--bd)}
.linha:first-child{border-top:0}
.nome strong{display:block}
.nome small{color:var(--mut)}
.trilho{position:relative;height:12px;background:var(--trilho);border-radius:3px;overflow:visible}
.trilho i{display:block;height:100%;border-radius:3px;background:var(--cor)}
.trilho u{position:absolute;left:33.33%;top:-4px;bottom:-4px;width:2px;background:var(--tx);opacity:.55}
.cob span{display:block;margin-top:4px;font-size:.85rem;color:var(--mut)}
.critico{--cor:var(--crit)}.atencao{--cor:var(--aten)}.ok{--cor:var(--ok)}
.acao{text-align:right;font-weight:600}
.acao small{display:block;font-weight:400;color:var(--cor)}
.ia{grid-column:1/-1;margin:0;font-size:.9rem;color:var(--mut);border-left:3px solid var(--bd);padding-left:10px}
.vazio{padding:24px;text-align:center;color:var(--mut)}
footer{margin-top:16px;font-size:.85rem;color:var(--mut)}
@media(max-width:700px){.linha{grid-template-columns:1fr}.acao{text-align:left}}
</style>
</head>
<body>
<main class="pagina">
  <header>
    <h1>Reposição de estoque</h1>
    <p>Quanto tempo cada peça dura no estoque e o que comprar primeiro.</p>
  </header>

  <div class="aviso" id="aviso" hidden></div>
  <ul class="resumo" id="resumo"></ul>
  <div class="filtros" id="filtros" role="group" aria-label="Filtrar por situação"></div>
  <ul class="lista" id="lista"></ul>

  <footer>
    A linha escura em cada barra marca 15 dias de cobertura. Sugestão de compra = vendas médias de 30 dias + estoque mínimo, menos o estoque atual.
  </footer>
</main>

<script>
// Dados de exemplo (fictícios). Se existir um dados.json na mesma pasta, ele substitui estes.
const EXEMPLO = [
  {produto:"Pastilha de freio dianteira", estoque:4,  minimo:10, vendas30:42},
  {produto:"Kit relação 428H",            estoque:9,  minimo:6,  vendas30:30},
  {produto:"Óleo 10W-30 (1 L)",           estoque:60, minimo:24, vendas30:90},
  {produto:"Vela de ignição",             estoque:35, minimo:20, vendas30:48},
  {produto:"Filtro de ar",                estoque:7,  minimo:8,  vendas30:15},
  {produto:"Cabo de embreagem",           estoque:18, minimo:6,  vendas30:12},
  {produto:"Pneu traseiro 90/90-18",      estoque:5,  minimo:4,  vendas30:20},
  {produto:"Bateria 12V 5Ah",             estoque:11, minimo:5,  vendas30:14},
  {produto:"Lâmpada de farol H4",         estoque:40, minimo:15, vendas30:36},
  {produto:"Retrovisor direito",          estoque:3,  minimo:4,  vendas30:6}
];
const ROTULO = {critico:"Crítico", atencao:"Atenção", ok:"Em dia"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let dados = EXEMPLO, exemplo = true, filtro = "todos";

function calcular(p){
  const porDia = p.vendas30 / 30;
  const cob = porDia > 0 ? p.estoque / porDia : 999;
  const st = p.estoque <= p.minimo ? "critico" : (cob < 15 ? "atencao" : "ok");
  const sug = st === "ok" ? 0 : Math.max(0, Math.ceil(porDia * 30 + p.minimo - p.estoque));
  return {...p, cob, st, sug};
}

function desenhar(){
  const itens = dados.map(calcular).sort((a,b) => a.cob - b.cob);
  const conta = st => itens.filter(i => i.st === st).length;

  const aviso = document.getElementById("aviso");
  aviso.hidden = !exemplo;
  aviso.textContent = "Dados de exemplo (fictícios). Para usar os seus, coloque um arquivo dados.json na mesma pasta, com os campos produto, estoque, minimo e vendas30.";

  document.getElementById("resumo").innerHTML =
    `<li><b>${itens.length}</b>produtos</li>` +
    `<li><b style="color:var(--crit)">${conta("critico")}</b>críticos</li>` +
    `<li><b style="color:var(--aten)">${conta("atencao")}</b>em atenção</li>` +
    `<li><b style="color:var(--ok)">${conta("ok")}</b>em dia</li>`;

  const opcoes = [["todos","Todos"],["critico","Críticos"],["atencao","Atenção"],["ok","Em dia"]];
  const f = document.getElementById("filtros");
  f.innerHTML = opcoes.map(([v,t]) => `<button type="button" data-f="${v}" aria-pressed="${filtro===v}">${t}</button>`).join("");
  f.querySelectorAll("button").forEach(b => b.onclick = () => { filtro = b.dataset.f; desenhar(); });

  const vis = itens.filter(i => filtro === "todos" || i.st === filtro);
  document.getElementById("lista").innerHTML = vis.length ? vis.map(p => {
    const larg = Math.min(p.cob, 45) / 45 * 100;
    const dias = p.cob > 900 ? "sem vendas no período" : `${Math.round(p.cob)} dias de estoque`;
    return `<li class="linha ${p.st}">
      <div class="nome"><strong>${esc(p.produto)}</strong>
        <small>estoque ${p.estoque}, mínimo ${p.minimo}, ${p.vendas30} vendas em 30 dias</small></div>
      <div class="cob"><div class="trilho"><i style="width:${larg}%"></i><u></u></div><span>${dias}</span></div>
      <div class="acao">${p.sug ? `Comprar ${p.sug} un.` : "Sem compra"}<small>${ROTULO[p.st]}</small></div>
      ${p.analise_ia ? `<p class="ia">${esc(p.analise_ia)}</p>` : ""}
    </li>`;
  }).join("") : `<li class="vazio">Nenhum produto nesta situação.</li>`;
}

fetch("dados.json")
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(j => { if (Array.isArray(j) && j.length) { dados = j; exemplo = false; } })
  .catch(() => {})
  .finally(desenhar);
</script>
</body>
</html>
